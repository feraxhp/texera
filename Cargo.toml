[package]
name = "texera"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["feraxhp <feraxhp+gh@gmail.com>"]
description = "A modular code-editor widget for ratatui, following the **\"Bring Your Own\" (BYO)** philosophy"
homepage = "https://github.com/feraxhp/texera"

[dependencies]
crossterm = { version = "0.29", optional = true }
mynox = "0.1.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex-automata = { version = "0.4", optional = true }
regex-syntax = { version = "0.8", optional = true }
ropey = "1.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1", optional = true }
texera-core = "0.99.2"
texera-macros = { path = "macros", version = "0.0.1", optional = true }
texera-pluggins = { version = "0.1.1", features = ["history"] }
toml = { version = "1", features = ["preserve_order"], optional = true }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[features]
default = ["crossterm", "highlight"]
crossterm = ["dep:crossterm"]
highlight = [
    "dep:regex-automata",
    "dep:regex-syntax",
    "dep:smallvec",
    "dep:texera-macros",
    "dep:toml",
]

[[example]]
name = "whitespace_viewer"
required-features = ["crossterm", "highlight"]

[[example]]
name = "terminal_editor"
required-features = ["crossterm", "highlight"]

[[test]]
name = "syntax_cache"
required-features = ["highlight"]

[[test]]
name = "syntax_embed"
required-features = ["highlight"]

[[test]]
name = "syntax_pattern"
required-features = ["highlight"]

[[test]]
name = "syntax_robustness"
required-features = ["highlight"]

[[test]]
name = "syntax_state_machine"
required-features = ["highlight"]

[[test]]
name = "syntax_theme"
required-features = ["highlight"]
